name: Deploy Nshare Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/netshare-relay
            git pull origin main
            npm install
            pm2 restart netshare-relay || pm2 start index.js --name netshare-relay
            pm2 save
