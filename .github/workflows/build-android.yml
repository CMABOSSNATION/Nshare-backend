name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('frontend/android/**/*.gradle*', 'frontend/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Set up Android SDK local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Show android folder contents (debug)
        run: |
          echo "=== frontend/ root ===" && ls -la
          echo "=== android/ ===" && ls -la android/ || echo "android/ not found"
          echo "=== android/gradle/wrapper/ ===" && ls -la android/gradle/wrapper/ || echo "wrapper dir not found"

      - name: Fix android gitignore to allow gradlew
        run: |
          if [ -f android/.gitignore ]; then
            sed -i '/gradlew/d' android/.gitignore
            sed -i '/gradle\/wrapper\/gradle-wrapper.jar/d' android/.gitignore
            echo "Cleaned android/.gitignore"
          fi

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f android/gradlew ]; then
            echo "gradlew missing — generating wrapper"
            cd android
            gradle wrapper --gradle-version=8.6
          else
            echo "gradlew already exists"
          fi

      - name: Generate gradle-wrapper.jar if missing
        run: |
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing — re-running gradle wrapper"
            cd android
            gradle wrapper --gradle-version=8.6
          else
            echo "gradle-wrapper.jar exists"
          fi

      - name: Grant Gradle execute permission
        run: chmod +x android/gradlew

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install required Android SDK components
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" || true

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m'
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nshare-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
