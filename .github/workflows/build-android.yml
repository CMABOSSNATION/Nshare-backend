name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install required Android SDK components
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('frontend/android/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Set up Android SDK local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      # ── Scaffold missing Gradle project files ──────────────────────────────

      - name: Create settings.gradle if missing
        run: |
          if [ ! -f android/settings.gradle ]; then
            cat > android/settings.gradle << 'EOF'
          rootProject.name = 'NshareApp'
          include ':app'
          EOF
            echo "Created settings.gradle"
          fi

      - name: Create root build.gradle if missing
        run: |
          if [ ! -f android/build.gradle ]; then
            cat > android/build.gradle << 'EOF'
          buildscript {
              ext {
                  buildToolsVersion = "34.0.0"
                  minSdkVersion = 24
                  compileSdkVersion = 34
                  targetSdkVersion = 34
              }
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath("com.android.tools.build:gradle:8.3.2")
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }

          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF
            echo "Created root build.gradle"
          fi

      - name: Create gradle.properties if missing
        run: |
          if [ ! -f android/gradle.properties ]; then
            cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
            echo "Created gradle.properties"
          fi

      - name: Create app/build.gradle if missing
        run: |
          if [ ! -f android/app/build.gradle ]; then
            cat > android/app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'

          android {
              compileSdk 34
              namespace "com.cmabossnation.nshare"

              defaultConfig {
                  applicationId "com.cmabossnation.nshare"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      debuggable true
                  }
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              // WireGuard VPN tunnel library (via JitPack)
              implementation 'com.github.WireGuard:wireguard-android:1.0.20230105'

              // AndroidX core
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core-ktx:1.12.0'

              // WebSocket for VPS relay communication
              implementation 'org.java-websocket:Java-WebSocket:1.5.4'

              // JSON parsing
              implementation 'com.google.code.gson:gson:2.10.1'
          }
          EOF
            echo "Created app/build.gradle"
          fi

      - name: Create app/src/main folder structure if missing
        run: |
          mkdir -p android/app/src/main/java/com/cmabossnation/nshare
          mkdir -p android/app/src/main/res/values

      - name: Create AndroidManifest.xml if missing
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- WireGuard / VPN permissions -->
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />

              <application
                  android:label="NShare"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <!-- WireGuard VPN Service -->
                  <service
                      android:name=".WireGuardVpnService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse"
                      android:permission="android.permission.BIND_VPN_SERVICE">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                  </service>

              </application>
          </manifest>
          EOF
            echo "Created AndroidManifest.xml"
          fi

      - name: Merge AndroidManifest.additions.xml if present
        run: |
          if [ -f android/AndroidManifest.additions.xml ]; then
            echo "AndroidManifest.additions.xml found - contents noted for manual merge:"
            cat android/AndroidManifest.additions.xml
          fi

      - name: Create strings.xml if missing
        run: |
          if [ ! -f android/app/src/main/res/values/strings.xml ]; then
            cat > android/app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">NShare</string>
          </resources>
          EOF
          fi

      - name: Create styles.xml if missing
        run: |
          if [ ! -f android/app/src/main/res/values/styles.xml ]; then
            cat > android/app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
              </style>
          </resources>
          EOF
          fi

      - name: Create MainActivity.java if missing
        run: |
          if [ ! -f android/app/src/main/java/com/cmabossnation/nshare/MainActivity.java ]; then
            cat > android/app/src/main/java/com/cmabossnation/nshare/MainActivity.java << 'EOF'
          package com.cmabossnation.nshare;

          import android.app.Activity;
          import android.os.Bundle;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
              }
          }
          EOF
          fi

      - name: Create WireGuardVpnService.java if missing
        run: |
          if [ ! -f android/app/src/main/java/com/cmabossnation/nshare/WireGuardVpnService.java ]; then
            cat > android/app/src/main/java/com/cmabossnation/nshare/WireGuardVpnService.java << 'EOF'
          package com.cmabossnation.nshare;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.Intent;
          import android.net.VpnService;
          import android.os.Build;
          import android.os.IBinder;

          /**
           * WireGuard-based VPN service for NShare internet sharing.
           * Routes traffic through a VPS relay over WireGuard tunnel.
           */
          public class WireGuardVpnService extends VpnService {

              private static final String CHANNEL_ID = "nshare_vpn_channel";
              private static final int NOTIFICATION_ID = 1;

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  createNotificationChannel();
                  Notification notification = new Notification.Builder(this, CHANNEL_ID)
                      .setContentTitle("NShare VPN Active")
                      .setContentText("Internet sharing is running")
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .build();
                  startForeground(NOTIFICATION_ID, notification);
                  return START_STICKY;
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  stopForeground(true);
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID,
                          "NShare VPN Service",
                          NotificationManager.IMPORTANCE_LOW
                      );
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) manager.createNotificationChannel(channel);
                  }
              }
          }
          EOF
          fi

      - name: Create proguard-rules.pro if missing
        run: |
          if [ ! -f android/app/proguard-rules.pro ]; then
            echo "# WireGuard" > android/app/proguard-rules.pro
            echo "-keep class com.wireguard.** { *; }" >> android/app/proguard-rules.pro
            echo "-keep class org.java_websocket.** { *; }" >> android/app/proguard-rules.pro
          fi

      # ── Generate Gradle wrapper ────────────────────────────────────────────

      - name: Create gradle wrapper properties
        run: |
          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.6-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Generate gradlew script
        run: |
          if [ ! -f android/gradlew ]; then
            gradle wrapper --gradle-version=8.6 --project-dir=android
          fi

      - name: Grant Gradle execute permission
        run: chmod +x android/gradlew

      # ── Build ──────────────────────────────────────────────────────────────

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m'
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nshare-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
